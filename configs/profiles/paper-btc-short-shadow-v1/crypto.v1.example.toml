category = "crypto"
enabled_strategies = ["crypto.phase2"]

[markets]
assets = ["BTC"]
include_keywords = ["above", "below", "under", "over"]
exclude_keywords = ["dip", "drop", "fall", "reach", "hit", "volatility", "realized", "dominance", "premium", "kimchi"]
expiries = ["next_7d"]
max_barrier_distance_ratio = 0.75
discovery_max_pages = 8
min_liquidity_score = 0.95
min_yes_mid_price = 0.10
max_yes_mid_price = 0.90
max_tradeable_spread_bps = 200
max_active_markets = 8
max_markets_per_event = 1
min_markets_per_event = 1

[strategy.phase2]
min_confidence = 0.6
min_net_edge_bps = 75.0
max_spread_bps = 250.0
min_liquidity_score = 0.0
min_contract_price = 0.10
taker_urgency_threshold = 0.62
maker_min_edge_bps = 100.0
resolution_maker_min_edge_bps = 150.0
maker_aggressiveness = 1.4
high_edge_taker_min_edge_bps = 125.0
high_edge_taker_max_spread_bps = 140.0
taker_max_entry_premium_bps = 600.0
repricing_taker_max_entry_premium_bps = 90.0
taker_slippage_guard_bps = 20.0
taker_min_net_edge_after_premium_bps = 250.0
taker_time_in_force = "IOC"
maker_quote_ttl_seconds = 10
resolution_maker_quote_ttl_seconds = 15
repricing_fallback_quote_ttl_seconds = 20
default_notional = 5.0
exit_edge_bps = 75
stop_loss_bps = 250
execution_max_holding_seconds = 1800.0
min_holding_seconds_before_exit = 30.0
aging_exit_edge_bps = 150.0
stale_exit_edge_bps = 300.0
aging_start_fraction = 0.35
stale_start_fraction = 0.75
stop_loss_min_ticks = 2
stop_loss_max_remaining_edge_bps = 150.0
adverse_fill_exit_bps = 75.0
adverse_fill_max_remaining_edge_bps = 150.0
time_stop_max_remaining_edge_bps = 300.0
max_holding_multiplier = 1.0
exit_repost_cooldown_seconds = 30.0
entry_repost_cooldown_seconds = 30.0
repricing_fallback_entry_repost_cooldown_seconds = 5.0
entry_failure_cooldown_seconds = 45.0
entry_market_cooldown_seconds = 120.0
repricing_fallback_entry_market_cooldown_seconds = 20.0
loss_reentry_cooldown_seconds = 3600.0
max_loss_trades_per_market = 1
max_loss_trades_per_exposure_group = 1
thesis_entry_cooldown_seconds = 20.0
single_active_market_per_thesis = true
max_no_fill_entry_attempts_per_market = 2
time_stop_force_ioc_after_expiries = 1
skip_selective_wide_spread_markets = true

[strategy.phase2.preset_registry.btc_dip_short_shadow]
match = { underlying = "BTC", event_family = "dip" }
overrides = { taker_urgency_threshold = 0.58, maker_aggressiveness = 1.6, maker_quote_ttl_seconds = 8, high_edge_taker_min_edge_bps = 110.0, high_edge_taker_max_spread_bps = 150.0, taker_max_entry_premium_bps = 750.0, repricing_taker_max_entry_premium_bps = 90.0, loss_reentry_cooldown_seconds = 3600.0, max_loss_trades_per_market = 1, max_loss_trades_per_exposure_group = 1, thesis_entry_cooldown_seconds = 20.0, single_active_market_per_thesis = true, max_no_fill_entry_attempts_per_market = 2, time_stop_max_remaining_edge_bps = 300.0, skip_selective_wide_spread_markets = true }

[strategy.phase2.preset_registry.btc_reach_short_shadow]
match = { underlying = "BTC", event_family = "reach" }
overrides = { taker_urgency_threshold = 0.60, maker_aggressiveness = 1.5, maker_quote_ttl_seconds = 8, high_edge_taker_min_edge_bps = 110.0, high_edge_taker_max_spread_bps = 150.0, taker_max_entry_premium_bps = 750.0, repricing_taker_max_entry_premium_bps = 90.0, loss_reentry_cooldown_seconds = 3600.0, max_loss_trades_per_market = 1, max_loss_trades_per_exposure_group = 1, thesis_entry_cooldown_seconds = 20.0, single_active_market_per_thesis = true, max_no_fill_entry_attempts_per_market = 2, time_stop_max_remaining_edge_bps = 300.0, skip_selective_wide_spread_markets = true }
