[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Modular Polymarket bot planning and implementation scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.2",
  "pydantic>=2.9.2",
  "tenacity>=9.0.0",
  "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.2",
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
  "types-PyYAML",
]

[project.scripts]
pm-bot = "pm_bot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pm_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["yaml", "py_clob_client", "py_clob_client.*"]
ignore_missing_imports = true
